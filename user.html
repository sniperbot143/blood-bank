<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafeHer - User</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="user-theme">
<header class="topbar">
  <h1>SafeHer <span class="role-tag">User</span></h1>
  <div class="user-info" id="userInfo">Guest</div>
  <button class="logout-btn" id="logoutBtn">Logout</button>
</header>

<main class="container">
  <section class="sos-section card">
    <h2>Emergency SOS</h2>
    <p>Press and hold for 2 seconds to trigger an emergency alert to police and hospital.</p>
    <button id="sosBtn" class="sos-btn">SOS</button>
    <div class="sos-options">
      <label><input type="checkbox" id="notifyPolice" checked /> Notify Police</label>
      <label><input type="checkbox" id="notifyHospital" checked /> Notify Hospital</label>
    </div>
    <div id="sosStatus" class="status"></div>
  </section>

  <div class="grid-2">
    <section class="card">
      <h2>Your Profile</h2>
      <div class="form">
        <input type="text" id="profName" placeholder="Full Name" />
        <input type="text" id="profPhone" placeholder="Phone Number" />
        <input type="number" id="profAge" placeholder="Age" />
        <input type="text" id="profBlood" placeholder="Blood Group (e.g. O+)" />
        <input type="text" id="profMedical" placeholder="Medical conditions/allergies" />
        <button class="btn" id="saveProfile">Save Profile</button>
      </div>
    </section>

    <section class="card">
      <h2>Trusted Contacts</h2>
      <div class="form">
        <input type="text" id="contactName" placeholder="Name" />
        <input type="text" id="contactPhone" placeholder="Phone" />
        <button class="btn" id="addContact">Add Contact</button>
      </div>
      <ul id="contactList" class="list"></ul>
    </section>
  </div>

  <div class="grid-2">
    <section class="card">
      <h2>Live Location</h2>
      <p id="locText">Location not shared yet.</p>
      <button class="btn" id="shareLoc">Share Live Location</button>
      <button class="btn ghost" id="stopLoc">Stop Sharing</button>
    </section>

    <section class="card">
      <h2>Safe Route Planner</h2>
      <div class="form">
        <input type="text" id="fromLoc" placeholder="From" />
        <input type="text" id="toLoc" placeholder="To" />
        <button class="btn" id="findRoute">Find Safe Route</button>
      </div>
      <div id="routeResult" class="status"></div>
    </section>
  </div>

  <section class="card">
    <h2>Report an Incident</h2>
    <div class="form">
      <select id="incType">
        <option value="Harassment">Harassment</option>
        <option value="Stalking">Stalking</option>
        <option value="Theft">Theft</option>
        <option value="Assault">Assault</option>
        <option value="Suspicious Activity">Suspicious Activity</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" id="incLocation" placeholder="Location" />
      <textarea id="incDesc" placeholder="Describe what happened..."></textarea>
      <label><input type="checkbox" id="incAnon" /> Report anonymously</label>
      <button class="btn" id="submitIncident">Submit Report</button>
    </div>
    <div id="incStatus" class="status"></div>
  </section>

  <section class="card">
    <h2>Safety Tools</h2>
    <div class="tools">
      <button class="tool-btn" id="fakeCall">Fake Call</button>
      <button class="tool-btn" id="loudAlarm">Loud Alarm</button>
      <button class="tool-btn" id="voiceRec">Voice Record</button>
      <button class="tool-btn" id="selfDefense">Self Defense Tips</button>
    </div>
    <div id="toolsOutput" class="status"></div>
  </section>

  <section class="card">
    <h2>My Alert History</h2>
    <ul id="alertHistory" class="list"></ul>
  </section>
</main>

<script src="js/app.js"></script>
<script src="js/guard.js"></script>
<script src="js/user.js"></script>
</body>
</html>
