<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafeHer - Hospital</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="hospital-theme">
<header class="topbar">
  <a href="index.html" class="back">&larr;</a>
  <h1>SafeHer <span class="role-tag">Hospital Response</span></h1>
  <div class="user-info">Emergency Dept</div>
</header>

<main class="container">
  <section class="stats-row">
    <div class="stat card"><h3 id="statEmergencies">0</h3><p>Active Emergencies</p></div>
    <div class="stat card"><h3 id="statAmbulances">6</h3><p>Ambulances Free</p></div>
    <div class="stat card"><h3 id="statBeds">14</h3><p>ER Beds Available</p></div>
    <div class="stat card"><h3 id="statTreated">0</h3><p>Treated Today</p></div>
  </section>

  <section class="card">
    <h2>Incoming Medical Emergencies</h2>
    <p class="muted">Live SOS alerts flagged for medical response.</p>
    <ul id="emergencyList" class="alert-list"></ul>
  </section>

  <section class="card">
    <h2>Ambulance Dispatch</h2>
    <div class="form">
      <select id="ambUnit">
        <option>Ambulance A-101</option>
        <option>Ambulance A-102</option>
        <option>Ambulance A-103</option>
        <option>Ambulance A-104</option>
      </select>
      <input type="text" id="ambTarget" placeholder="Pickup location" />
      <input type="text" id="ambPatient" placeholder="Patient name (optional)" />
      <button class="btn" id="dispatchAmb">Dispatch Ambulance</button>
    </div>
    <ul id="ambLog" class="list"></ul>
  </section>

  <section class="card">
    <h2>Patient Records (from SOS)</h2>
    <ul id="patientList" class="alert-list"></ul>
  </section>
</main>

<script src="js/app.js"></script>
<script src="js/hospital.js"></script>
</body>
</html>
