<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafeHer - Police</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="police-theme">
<header class="topbar">
  <h1>SafeHer <span class="role-tag">Police Control</span></h1>
  <div class="user-info" id="userInfo">Officer on duty</div>
  <button class="logout-btn" id="logoutBtn">Logout</button>
</header>

<main class="container">
  <section class="stats-row">
    <div class="stat card"><h3 id="statActive">0</h3><p>Active SOS</p></div>
    <div class="stat card"><h3 id="statIncidents">0</h3><p>Open Incidents</p></div>
    <div class="stat card"><h3 id="statResolved">0</h3><p>Resolved Today</p></div>
    <div class="stat card"><h3 id="statPatrols">4</h3><p>Patrols Available</p></div>
  </section>

  <section class="card">
    <h2>Live SOS Alerts</h2>
    <p class="muted">Real-time emergency alerts from users requiring immediate response.</p>
    <ul id="sosList" class="alert-list"></ul>
  </section>

  <section class="card">
    <h2>Incident Reports</h2>
    <div class="filter-bar">
      <select id="filterType">
        <option value="">All Types</option>
        <option>Harassment</option>
        <option>Stalking</option>
        <option>Theft</option>
        <option>Assault</option>
        <option>Suspicious Activity</option>
        <option>Other</option>
      </select>
      <select id="filterStatus">
        <option value="">All Status</option>
        <option>Open</option>
        <option>Investigating</option>
        <option>Resolved</option>
      </select>
    </div>
    <ul id="incidentList" class="alert-list"></ul>
  </section>

  <section class="card">
    <h2>Patrol Dispatch</h2>
    <div class="form">
      <select id="patrolUnit">
        <option>Unit 1 - City Center</option>
        <option>Unit 2 - North</option>
        <option>Unit 3 - South</option>
        <option>Unit 4 - East</option>
      </select>
      <input type="text" id="patrolTarget" placeholder="Dispatch to location" />
      <button class="btn" id="dispatchBtn">Dispatch Unit</button>
    </div>
    <ul id="dispatchLog" class="list"></ul>
  </section>
</main>

<script src="js/app.js"></script>
<script src="js/guard.js"></script>
<script src="js/police.js"></script>
</body>
</html>
